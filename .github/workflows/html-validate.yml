name: HTML Validation

# Valideert alle HTML-bestanden tegen W3C HTML5 specificatie.
# Vangt kapotte tags, missende attributen en onjuiste structuur.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-html:
    name: Valideer HTML5
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: _site
          css: false
          extra: --also-check-css --Werror
          blacklist: |
            node_modules
            google26dfc393f11fd085.html

      - name: Summary
        if: always()
        run: |
          echo "## HTML validatie voltooid" >> $GITHUB_STEP_SUMMARY
          echo "Alle .html bestanden zijn gecontroleerd tegen W3C HTML5 specificatie." >> $GITHUB_STEP_SUMMARY
