name: Deploy Readiness

# Valideert alle data-bestanden en zorgt dat de site deployable is.
# Controleert JSON syntax, bestandsstructuur en kritieke assets.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-data:
    name: Valideer JSON + bestandsstructuur
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate all JSON files
        run: |
          python3 << 'EOF'
          import json
          import sys
          from pathlib import Path

          json_files = list(Path('.').rglob('*.json'))
          json_files = [f for f in json_files if '.github' not in str(f) and 'node_modules' not in str(f) and '_site' not in str(f)]

          failed = 0
          for f in json_files:
              try:
                  with open(f) as fh:
                      json.load(fh)
                  print(f"✓ {f}")
              except json.JSONDecodeError as e:
                  print(f"✗ {f}: {e}")
                  failed += 1

          if failed:
              sys.exit(1)
          print(f"\n{len(json_files)} JSON bestanden gevalideerd")
          EOF

      - name: Validate portfolio.json structure
        run: |
          python3 << 'EOF'
          import json
          import sys
          from pathlib import Path

          with open('data/portfolio.json') as f:
              data = json.load(f)

          if 'items' not in data:
              print("✗ portfolio.json missing 'items' array")
              sys.exit(1)

          required_fields = ['id', 'name', 'category', 'scope']
          failed = 0
          for i, item in enumerate(data['items']):
              for field in required_fields:
                  if field not in item or not item[field]:
                      print(f"✗ Item {i}: missing '{field}'")
                      failed += 1

              # Check image exists in _site/ if specified
              if item.get('image'):
                  image_path = Path('_site' + item['image'])
                  if not image_path.exists():
                      print(f"✗ Item {i} ({item.get('name')}): image not found — _site{item['image']}")
                      failed += 1

          if failed:
              sys.exit(1)
          print(f"✓ Portfolio valid — {len(data['items'])} items, all images found")
          EOF

      - name: Validate reviews.json structure
        run: |
          python3 << 'EOF'
          import json
          import sys

          with open('data/reviews.json') as f:
              data = json.load(f)

          if 'items' not in data:
              print("✗ reviews.json missing 'items' array")
              sys.exit(1)

          required_fields = ['id', 'quote', 'name', 'stars']
          failed = 0
          for i, item in enumerate(data['items']):
              for field in required_fields:
                  if field not in item:
                      print(f"✗ Review {i}: missing '{field}'")
                      failed += 1

              stars = item.get('stars', 0)
              if not isinstance(stars, int) or stars < 1 or stars > 5:
                  print(f"✗ Review {i}: stars must be 1-5, got {stars}")
                  failed += 1

          if failed:
              sys.exit(1)
          print(f"✓ Reviews valid — {len(data['items'])} reviews")
          EOF

      - name: Check critical assets exist
        run: |
          critical_files=(
            "_site/index.html"
            "_site/sitemap.xml"
            "_site/robots.txt"
            "_site/llms.txt"
            "_site/manifest.json"
            "_site/_headers"
            "_site/_redirects"
            "_site/public/images/logo.webp"
            "_site/public/images/favicon-32.png"
            "_site/public/images/favicon-192.png"
            "_site/public/images/favicon-512.png"
            "_site/public/images/og-image.jpg"
            "data/portfolio.json"
            "data/reviews.json"
          )

          failed=0
          for f in "${critical_files[@]}"; do
            if [ -f "$f" ]; then
              echo "✓ $f"
            else
              echo "✗ MISSING: $f"
              failed=$((failed + 1))
            fi
          done

          if [ $failed -gt 0 ]; then
            echo "Deployment blocked — critical assets missing"
            exit 1
          fi

      - name: Verify _redirects syntax
        run: |
          python3 << 'EOF'
          import re
          import sys

          with open('_site/_redirects') as f:
              lines = [l.strip() for l in f if l.strip() and not l.strip().startswith('#')]

          # Valid line: /from /to [status]
          pattern = re.compile(r'^(/\S*|https?://\S+)\s+(/\S*|https?://\S+)(\s+(\d{3}!?))?(\s+.*)?$')
          failed = 0
          for i, line in enumerate(lines, 1):
              if not pattern.match(line):
                  print(f"✗ Line {i}: invalid syntax — {line!r}")
                  failed += 1

          if failed:
              sys.exit(1)
          print(f"✓ _redirects valid — {len(lines)} rules")
          EOF
