name: Link Check

# Scant alle links (intern en extern) op broken references.
# Dode links schaden SEO en user experience.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    # Weekelijks op maandag 06:00 UTC — externe links veranderen
    - cron: '0 6 * * 1'

jobs:
  link-check:
    name: Scan broken links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        continue-on-error: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # ── Step A: INTERNAL assets + THIRD-PARTY external links (build-blocking) ──
      # The live apex (alfareclame.nl) now serves the Next.js site, NOT this 11ty
      # build, so its URL structure differs. Self-referential absolute links to
      # the live domain are therefore EXCLUDED here and validated separately as a
      # warning (Step B). This step still validates internal relative asset links
      # (resolved against ./_site) and genuine third-party external links.
      - name: Run lychee — internal + external (fail on broken)
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,301,302,403,429
            --max-concurrency 5
            --timeout 20
            --retry-wait-time 5
            --max-retries 5
            --exclude-all-private
            --exclude '^https?://(?:www\.)?alfareclame\.nl'
            --exclude '^https?://(?:www\.)?(?:localhost|127\.0\.0\.1)'
            --exclude 'wa\.me'
            --exclude 'maps\.app\.goo\.gl'
            --exclude 'mailto:'
            --exclude 'tel:'
            --exclude 'fonts\.(?:googleapis|gstatic)\.com'
            '_site/**/*.html' '_site/sitemap.xml'
          fail: true
          output: ./lychee/internal-external.md

      # ── Step B: LIVE own-domain health (warning only, never fails the build) ──
      # Checks the published apex URLs from the sitemap. Transient OpenNext
      # cold-start 503s are tolerated (accepted); genuine 404s surface as a
      # warning artifact without blocking CI on a site this repo no longer owns.
      - name: Run lychee — live own-domain (warning only)
        id: live_health
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,301,302,403,429,503
            --max-concurrency 3
            --timeout 30
            --retry-wait-time 5
            --max-retries 5
            --include '^https?://(?:www\.)?alfareclame\.nl'
            '_site/sitemap.xml'
          fail: false
          output: ./lychee/live-domain.md

      - name: Flag live-domain warnings
        if: steps.live_health.outcome == 'failure'
        run: echo "::warning title=Live own-domain links::Some alfareclame.nl URLs returned errors. See the 'link-check-report' artifact (live-domain.md). Not blocking CI."

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: link-check-report
          path: ./lychee/
          retention-days: 30
