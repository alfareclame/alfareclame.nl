name: Sitemap Submit

on:
  push:
    branches: [main]
    paths:
      - 'sitemap.njk'
      - 'sitemap-*.njk'
      - 'sitemap-*.xml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Wait for CF Pages deploy and fetch live sitemap
        run: |
          for i in $(seq 1 12); do
            if curl -sSf -o sitemap.xml "https://alfareclame.nl/sitemap.xml"; then
              echo "Live sitemap fetched on attempt $i ($(wc -l < sitemap.xml) lines)"
              exit 0
            fi
            echo "Attempt $i/12: sitemap not ready (CF Pages still deploying), waiting 15s..."
            sleep 15
          done
          echo "ERROR: live sitemap not reachable after 3 minutes"
          exit 1

      - run: node scripts/sitemap-submit.mjs

      - name: Commit history updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(sitemap): submission history update"
          file_pattern: data/sitemap-history.jsonl
